<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>鲸鱼娘</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #stage.dragging { cursor: grabbing; }
    .flip { transform: scaleX(-1); }

    /* 气泡锚点：包住鲸鱼本体区域，气泡挂在它上方，随窗口同层不裁剪 */
    #bubble-anchor {
      position: absolute;
      left: 20px;
      top: 30px;
      width: 160px;
      height: 130px;
      pointer-events: none;
      animation: floaty 3s ease-in-out infinite;
    }
    #pet {
      position: absolute;
      left: 20px;
      top: 30px;
      width: 160px;
      height: 130px;
    }
    #pet-img {
      width: 160px;
      height: 130px;
      object-fit: contain;
      display: none;
      animation: floaty 3s ease-in-out infinite;
      transform-origin: 80px 65px;
    }
    #float-anim {
      animation: floaty 3s ease-in-out infinite;
      transform-origin: 80px 65px;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-2deg); }
    }
    #tail {
      transform-origin: 22px 62px;
      animation: tailwag 1.6s ease-in-out infinite;
    }
    @keyframes tailwag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-14deg); }
    }
    .swimming #tail { animation-duration: 0.5s; }
    .swimming #float-anim, .swimming #pet-img { animation-duration: 1.2s; }
    #eye-left, #eye-right {
      animation: blink 4s infinite;
      transform-origin: center;
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }
    .happy #eye-left, .happy #eye-right { display: none; }
    .happy .eye-happy { display: block; }
    .eye-happy { display: none; }
    .sad .mouth-smile { display: none; }
    .sad .mouth-sad { display: block; }
    .sleeping #eye-left, .sleeping #eye-right { display: none; }
    .sleeping .eye-sleep { display: block; }
    .eye-sleep { display: none; }

    /* 气泡：紧贴鲸鱼本体上方，随形象浮动动画同步移动，保持在窗口内 */
    #bubble {
      position: absolute;
      bottom: calc(100% - 42px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #4D6BFE;
      border-radius: 12px;
      padding: 6px 10px;
      max-width: 172px;
      font-size: 12px;
      line-height: 1.4;
      color: #1a2340;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      box-shadow: 0 2px 10px rgba(77, 107, 254, 0.25);
      word-wrap: break-word;
      z-index: 5;
      animation: bubbleFloaty 3s ease-in-out infinite;
    }
    @keyframes bubbleFloaty {
      0%, 100% { margin-bottom: 0px; }
      50% { margin-bottom: -8px; }
    }
    #bubble.show { opacity: 1; }
    #bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      margin-left: -7px;
      border-width: 7px 7px 0;
      border-style: solid;
      border-color: #4D6BFE transparent transparent;
    }
    #bubble.kind-system { border-color: #ff7b54; }
    #bubble.kind-system::after { border-color: #ff7b54 transparent transparent; }

    /* 番茄钟/聊天按钮：必须落在鲸鱼本体判定区内（20..180, 30..160），否则点击穿透点不到 */
    #pomo {
      position: absolute;
      right: 20px;
      bottom: 46px;
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid #e74c3c;
      border-radius: 50%;
      width: 58px;
      height: 58px;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-size: 14px;
      font-weight: bold;
      color: #e74c3c;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 4;
    }
    #pomo.rest { border-color: #27ae60; color: #27ae60; }
    #pomo .label { font-size: 9px; font-weight: normal; }
    #pomo:hover { transform: scale(1.08); }
    #pomo.show { display: flex; }

    #feed {
      position: absolute;
      font-size: 26px;
      pointer-events: none;
      opacity: 0;
      left: 80px;
      top: 60px;
      z-index: 4;
    }
    #feed.eat { animation: eatAnim 0.9s ease forwards; }
    @keyframes eatAnim {
      0% { opacity: 0; transform: translateY(-30px) scale(0.6) rotate(0deg); }
      30% { opacity: 1; transform: translateY(0) scale(1) rotate(10deg); }
      70% { opacity: 1; transform: translateY(0) scale(1) rotate(-8deg); }
      100% { opacity: 0; transform: translateY(20px) scale(0.3); }
    }

    #hint {
      position: absolute;
      bottom: 2px;
      left: 6px;
      font-size: 10px;
      color: rgba(255,255,255,0.75);
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    #chat-fab {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #4D6BFE;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(77, 107, 254, 0.5);
      z-index: 4;
    }
    #chat-fab:hover { transform: translateX(-50%) scale(1.12); }
    #stage:hover #chat-fab { display: flex; }

    #ctxmenu {
      position: absolute;
      display: none;
      background: rgba(30, 38, 70, 0.96);
      border: 1px solid rgba(120, 140, 255, 0.5);
      border-radius: 8px;
      padding: 4px 0;
      min-width: 120px;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #ctxmenu .item {
      padding: 6px 14px;
      font-size: 13px;
      color: #dde5ff;
      cursor: pointer;
      white-space: nowrap;
    }
    #ctxmenu .item:hover { background: rgba(77, 107, 254, 0.4); }
  </style>
</head>
<body>
  <div id="stage">
    <div id="bubble-anchor">
      <div id="bubble"></div>
    </div>
    <div id="ctxmenu">
      <div class="item" id="cm-chat">💬 和我聊天</div>
      <div class="item" id="cm-roam">🌊 开始游动</div>
      <div class="item" id="cm-quit">🚪 退出桌宠</div>
    </div>
    <div id="pet">
      <svg id="whale-svg" viewBox="0 0 160 130" width="160" height="130">
        <g id="float-anim">
          <g id="tail">
            <path d="M 30 62 Q 8 48 4 34 Q 14 46 24 48 Q 10 56 14 66 Q 4 74 6 88 Q 12 70 30 72 Z"
              fill="#4D6BFE" stroke="#3a54d4" stroke-width="2" stroke-linejoin="round" />
          </g>
          <ellipse cx="85" cy="68" rx="62" ry="44" fill="#4D6BFE" stroke="#3a54d4" stroke-width="2.5" />
          <ellipse cx="78" cy="80" rx="48" ry="26" fill="#6d87ff" opacity="0.55" />
          <path d="M 55 30 Q 85 12 115 32" fill="none" stroke="#3a54d4" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="47" cy="26" r="5.5" fill="#e8f0ff" stroke="#3a54d4" stroke-width="2" />
          <path d="M 30 30 Q 44 22 52 26" stroke="#3a54d4" stroke-width="2" fill="none" stroke-linecap="round" />
          <path d="M 60 26 Q 68 22 74 27" stroke="#3a54d4" stroke-width="2" fill="none" stroke-linecap="round" />
          <ellipse cx="70" cy="52" rx="4.5" ry="6" fill="#ffffff" />
          <ellipse cx="102" cy="52" rx="4.5" ry="6" fill="#ffffff" />
          <ellipse id="eye-left" cx="70" cy="52" rx="2.6" ry="3.8" fill="#1a2340" />
          <ellipse id="eye-right" cx="102" cy="52" rx="2.6" ry="3.8" fill="#1a2340" />
          <path class="eye-happy" d="M 65 53 Q 70 48 75 53" stroke="#1a2340" stroke-width="2.2" fill="none" stroke-linecap="round" />
          <path class="eye-happy" d="M 97 53 Q 102 48 107 53" stroke="#1a2340" stroke-width="2.2" fill="none" stroke-linecap="round" />
          <path class="eye-sleep" d="M 65 52 Q 70 56 75 52" stroke="#1a2340" stroke-width="2.2" fill="none" stroke-linecap="round" />
          <path class="eye-sleep" d="M 97 52 Q 102 56 107 52" stroke="#1a2340" stroke-width="2.2" fill="none" stroke-linecap="round" />
          <ellipse cx="58" cy="62" rx="5" ry="3.5" fill="#ff9eb5" opacity="0.7" />
          <ellipse cx="112" cy="62" rx="5" ry="3.5" fill="#ff9eb5" opacity="0.7" />
          <path class="mouth-smile" d="M 80 68 Q 86 74 92 68" stroke="#1a2340" stroke-width="2.2" fill="none" stroke-linecap="round" />
          <path class="mouth-sad" d="M 80 72 Q 86 67 92 72" stroke="#1a2340" stroke-width="2.2" fill="none" stroke-linecap="round" />
          <path d="M 120 44 Q 130 52 122 60" stroke="#3a54d4" stroke-width="2" fill="none" stroke-linecap="round" />
          <ellipse cx="40" cy="84" rx="6" ry="4" fill="#8fb0ff" opacity="0.8" />
          <ellipse cx="126" cy="86" rx="5" ry="3.5" fill="#8fb0ff" opacity="0.8" />
        </g>
      </svg>
      <img id="pet-img" draggable="false" />
    </div>
    <div id="feed">🐟</div>
    <div id="pomo"><span id="pomo-time">25:00</span><span class="label" id="pomo-label">工作</span></div>
    <button id="chat-fab" title="和鲸鱼娘聊天">💬</button>
    <div id="hint">拖动 · 双击喂食 · 右键菜单</div>
  </div>

  <script>
    const api = window.petApi;
    const stage = document.getElementById('stage');
    const petEl = document.getElementById('pet');
    const whaleSvg = document.getElementById('whale-svg');
    const petImg = document.getElementById('pet-img');
    const bubbleEl = document.getElementById('bubble');
    const pomoEl = document.getElementById('pomo');
    const pomoTime = document.getElementById('pomo-time');
    const pomoLabel = document.getElementById('pomo-label');
    const feedEl = document.getElementById('feed');

    // ---------- 自定义形象：优先加载 pet.png，失败回退 SVG ----------
    let useImageMode = false;
    const baseImg = new Image();
    const moodImgs = {}; // happy/sleeping/sad -> src（存在才用）
    baseImg.onload = () => {
      useImageMode = true;
      petImg.src = baseImg.src;
      petImg.style.display = 'block';
      whaleSvg.style.display = 'none';
      [['happy', 'pet-happy.png'], ['sleeping', 'pet-sleep.png'], ['sad', 'pet-sad.png']].forEach(([mood, file]) => {
        const im = new Image();
        im.onload = () => { moodImgs[mood] = im.src; };
        im.src = file;
      });
    };
    baseImg.src = 'pet.png';

    // ---------- 交互判定区（与主进程穿透逻辑一致） ----------
    const PET_BOX = { x: 20, y: 30, w: 160, h: 130 };
    let mouseInPet = false;
    function updateMouseInPet(e) {
      mouseInPet = e.offsetX >= PET_BOX.x && e.offsetX <= PET_BOX.x + PET_BOX.w
        && e.offsetY >= PET_BOX.y && e.offsetY <= PET_BOX.y + PET_BOX.h;
    }

    // ---------- 拖拽 ----------
    let dragging = false;
    let lastX = 0, lastY = 0;
    stage.addEventListener('mousemove', (e) => {
      updateMouseInPet(e);
      if (!dragging) stage.style.cursor = mouseInPet ? 'grab' : 'default';
    });
    stage.addEventListener('mouseleave', () => { mouseInPet = false; });
    stage.addEventListener('mousedown', (e) => {
      if (!mouseInPet) return;
      dragging = true;
      lastX = e.screenX;
      lastY = e.screenY;
      stage.classList.add('dragging');
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const dx = e.screenX - lastX;
      const dy = e.screenY - lastY;
      lastX = e.screenX;
      lastY = e.screenY;
      api.dragBy(dx, dy);
    });
    window.addEventListener('mouseup', () => {
      dragging = false;
      stage.classList.remove('dragging');
    });

    // ---------- 双击喂食 ----------
    stage.addEventListener('dblclick', () => {
      if (mouseInPet) feed();
    });
    function feed() {
      mood.add(12);
      setLook('happy', 2200);
      feedEl.textContent = ['🐟', '🍪', '🦑', '🍤'][Math.floor(Math.random() * 4)];
      feedEl.classList.remove('eat');
      void feedEl.offsetWidth;
      feedEl.classList.add('eat');
      say(['好吃好吃～', '谢谢投喂！🐳', '还要还要！', '唔姆～真香'], 'normal', 2000);
    }

    // ---------- 气泡 ----------
    let bubbleTimer = null;
    function say(text, kind = 'normal', duration = 4200) {
      bubbleEl.textContent = text;
      bubbleEl.className = 'show' + (kind === 'system' ? ' kind-system' : '');
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubbleEl.classList.remove('show'), duration);
    }

    const RANDOM_LINES = [
      '在忙什么呀？',
      '陪我玩一会儿嘛～',
      '记得多喝水哦！',
      'DeepSeek 一下，你就知道～',
      '我今天可爱吗？🐳',
      '摸鱼的时候也要小心老板哦',
      '要不要开始一个番茄钟？🍅',
      '呜……有点想睡觉了',
      '你说，海底有没有 WiFi？',
    ];
    let cfg = { bubblesEnabled: true, roamEnabled: false };
    async function initConfig() {
      cfg = await api.getConfig();
    }
    initConfig();
    setInterval(() => {
      if (!cfg.bubblesEnabled) return;
      if (Math.random() < 0.6) say(RANDOM_LINES[Math.floor(Math.random() * RANDOM_LINES.length)]);
    }, 45000);

    // ---------- 心情系统 ----------
    const mood = {
      value: 70,
      lastInteract: Date.now(),
      add(n) {
        this.value = Math.max(0, Math.min(100, this.value + n));
        this.lastInteract = Date.now();
      },
    };
    stage.addEventListener('mousedown', () => mouseInPet && mood.add(1));
    setInterval(() => {
      const idleMin = (Date.now() - mood.lastInteract) / 60000;
      mood.value = Math.max(0, mood.value - 0.4);
      if (mood.value < 25) setLook('sad');
      else if (idleMin > 10) setLook('sleeping');
      else if (mood.value > 80) setLook('happy');
      else setLook('normal');
    }, 3000);

    let lookState = 'normal';
    let happyOverrideUntil = 0;
    function setLook(state, duration = 0) {
      if (duration) happyOverrideUntil = Date.now() + duration;
      if (Date.now() < happyOverrideUntil && state !== 'happy') return;
      if (state === lookState) return;
      lookState = state;
      if (useImageMode) {
        const src = state !== 'normal' && moodImgs[state] ? moodImgs[state] : baseImg.src;
        if (petImg.src !== src) petImg.src = src;
        return;
      }
      whaleSvg.classList.remove('happy', 'sad', 'sleeping');
      if (state !== 'normal') whaleSvg.classList.add(state);
    }

    // ---------- 番茄钟显示 ----------
    api.onPomodoroState((s) => {
      if (!s || s.mode === 'idle') {
        pomoEl.classList.remove('show');
        return;
      }
      pomoEl.classList.add('show');
      pomoEl.classList.toggle('rest', s.mode === 'rest');
      const m = Math.floor(s.remaining / 60);
      const sec = s.remaining % 60;
      pomoTime.textContent = `${m}:${String(sec).padStart(2, '0')}`;
      pomoLabel.textContent = s.mode === 'work' ? '工作' : '休息';
    });
    pomoEl.addEventListener('click', (e) => {
      e.stopPropagation();
      if (pomoEl.classList.contains('rest')) api.togglePomodoroRest();
      else api.togglePomodoroWork();
    });

    // ---------- 游动 / 朝向 ----------
    api.onFlip(({ facing }) => petEl.classList.toggle('flip', facing === 'left'));
    api.onSwim(() => stage.classList.add('swimming'));
    api.onSwimEnd(() => stage.classList.remove('swimming'));
    api.onRoamChanged(({ enabled }) => { cfg.roamEnabled = enabled; });
    api.onBubblesChanged(({ enabled }) => { cfg.bubblesEnabled = enabled; });
    api.onSay((data) => say(data.text, data.kind, 6000));

    // ---------- 右键小菜单 ----------
    const ctxMenu = document.getElementById('ctxmenu');
    let ctxHideTimer = null;
    function hideCtxMenu() { ctxMenu.style.display = 'none'; }
    stage.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (!mouseInPet) return;
      document.getElementById('cm-roam').textContent = cfg.roamEnabled ? '🌊 暂停游动' : '🌊 开始游动';
      ctxMenu.style.left = Math.min(e.offsetX, 60) + 'px';
      ctxMenu.style.top = Math.min(e.offsetY, 110) + 'px';
      ctxMenu.style.display = 'block';
      clearTimeout(ctxHideTimer);
      ctxHideTimer = setTimeout(hideCtxMenu, 6000);
    });
    stage.addEventListener('mousedown', (e) => {
      if (ctxMenu.contains(e.target)) return;
      hideCtxMenu();
    });
    document.getElementById('cm-chat').addEventListener('click', (e) => {
      e.stopPropagation();
      hideCtxMenu();
      api.openChat();
    });
    document.getElementById('cm-roam').addEventListener('click', (e) => {
      e.stopPropagation();
      hideCtxMenu();
      api.toggleRoam();
    });
    document.getElementById('cm-quit').addEventListener('click', (e) => {
      e.stopPropagation();
      hideCtxMenu();
      api.quitApp();
    });

    // ---------- 聊天按钮 ----------
    document.getElementById('chat-fab').addEventListener('click', (e) => {
      e.stopPropagation();
      api.openChat();
    });

    document.addEventListener('dragstart', (e) => e.preventDefault());
  </script>
</body>
</html>
