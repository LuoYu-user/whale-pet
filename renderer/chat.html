<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>和鲸鱼娘聊天</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    #wrap {
      width: 100%;
      height: 100%;
      background: rgba(24, 32, 62, 0.92);
      border: 1px solid rgba(77, 107, 254, 0.6);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #titlebar {
      height: 38px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      -webkit-app-region: drag;
      gap: 8px;
    }
    #titlebar .title { color: #cdd8ff; font-size: 13px; flex: 1; }
    #titlebar button {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: #8899cc;
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }
    #titlebar button:hover { color: #fff; background: rgba(255,255,255,0.1); }
    #status {
      font-size: 11px;
      color: #6ee7a0;
    }
    #status.warn { color: #ffcc66; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(120,140,255,0.4); border-radius: 3px; }
    .msg { max-width: 82%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: #4D6BFE; color: white; border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: rgba(255,255,255,0.12); color: #e8eeff; border-bottom-left-radius: 4px; }
    .msg.error { align-self: center; background: rgba(255,80,80,0.15); color: #ff9999; font-size: 12px; border-radius: 8px; }
    .msg.typing { color: #8899cc; font-style: italic; }
    .msg .think { display: block; color: #8fa3d8; font-size: 11px; margin-bottom: 4px; }
    #inputbar {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    #input {
      flex: 1;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #e8eeff;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      resize: none;
      height: 38px;
      font-family: inherit;
    }
    #input:focus { border-color: #4D6BFE; }
    #send {
      background: #4D6BFE;
      border: none;
      color: white;
      border-radius: 8px;
      width: 52px;
      cursor: pointer;
      font-size: 15px;
    }
    #send:hover { background: #5d7aff; }
    #send:disabled { background: #33448f; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="titlebar">
      <span class="title">🐳 鲸鱼娘</span>
      <span id="status">在线</span>
      <button id="close" title="关闭">✕</button>
    </div>
    <div id="messages"></div>
    <div id="inputbar">
      <textarea id="input" placeholder="和鲸鱼娘说点什么…（Enter 发送）"></textarea>
      <button id="send">➤</button>
    </div>
  </div>
  <script>
    const api = window.petApi;
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendEl = document.getElementById('send');
    const statusEl = document.getElementById('status');

    let history = [];
    let busy = false;

    function addMsg(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text || busy) return;
      inputEl.value = '';
      addMsg('user', text);
      history.push({ role: 'user', content: text });
      busy = true;
      sendEl.disabled = true;
      statusEl.textContent = '思考中…';
      statusEl.classList.add('warn');
      const typing = addMsg('bot typing', '（鲸鱼娘游过来想了想…）');
      const res = await api.chatSend(history.slice(-20));
      typing.remove();
      if (res.ok) {
        addMsg('bot', res.reply);
        history.push({ role: 'assistant', content: res.reply });
        statusEl.textContent = '在线';
        statusEl.classList.remove('warn');
      } else {
        addMsg('error', res.error);
        history.pop();
        statusEl.textContent = '离线';
        statusEl.classList.add('warn');
      }
      busy = false;
      sendEl.disabled = false;
      inputEl.focus();
    }

    sendEl.addEventListener('click', send);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    document.getElementById('close').addEventListener('click', () => api.closeChat());

    api.onChatFocus(() => {
      inputEl.focus();
      if (history.length === 0) {
        addMsg('bot', '你好呀！我是鲸鱼娘 🐳 有什么想聊的或者想问的都可以说～');
      }
    });

    (async () => {
      const cfg = await api.getConfig();
      if (!cfg.hasApiKey) {
        statusEl.textContent = '未配置密钥';
        statusEl.classList.add('warn');
        addMsg('error', '还没有配置 DeepSeek API 密钥。请在项目目录的 .env 文件里写一行：DEEPSEEK_API_KEY=你的密钥，然后重启桌宠。');
      }
    })();
  </script>
</body>
</html>
